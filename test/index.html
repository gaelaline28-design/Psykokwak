<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boîte de commentaires</title>
    <!-- Lien vers le fichier CSS externe -->
    <link rel="stylesheet" href="../test/css/style.css">
</head>
<body>

    <!-- Structure principale du formulaire / de la boîte -->
    <div class="feedback-box">
        
        <!-- Titre / Texte d'instruction à gauche -->
        <label for="feedback-input" class="feedback-label">
            Dis-moi ce que tu penses
        </label>
        
        <!-- Zone d'écriture (champ de texte) à droite -->
        <textarea 
            id="feedback-input" 
            class="feedback-textarea" 
            placeholder="Écris ton avis ici..."></textarea>
            
    </div>

</body>
</html>
